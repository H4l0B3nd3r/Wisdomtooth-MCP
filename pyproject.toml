[project]
name = "claude-advisor-mcp"
version = "0.7.0"
description = "MCP server that lets coding agents escalate to Claude for advice when stuck"
requires-python = ">=3.10"
# Pins reflect the APIs this server actually uses:
#   anthropic>=0.72  -> output_config.effort, thinking={"type":"adaptive"}
#   mcp>=1.12        -> FastMCP tool(title=..., annotations=ToolAnnotations(...))
dependencies = ["mcp>=1.12", "anthropic>=0.72"]

[project.scripts]
claude-advisor-mcp = "claude_advisor.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_advisor"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "anyio>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
