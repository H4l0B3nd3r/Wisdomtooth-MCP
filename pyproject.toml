[project]
name = "wisdomtooth-mcp"
version = "0.11.1"
description = "MCP server that lets coding agents escalate to frontier models for advice when stuck: Claude by default, plus ChatGPT, Gemini or local models, one at a time or several at once"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
keywords = ["mcp", "model-context-protocol", "claude", "chatgpt", "gemini", "coding-agent", "local-llm", "kilo-code"]
# Pins reflect the APIs this server actually uses:
#   anthropic>=0.72  -> output_config.effort, thinking={"type":"adaptive"}
#   mcp>=1.12        -> FastMCP tool(title=..., annotations=ToolAnnotations(...))
# Upper bounds at the next major: both SDKs have broken this server's imports
# across majors before, and a `uv tool install` should never pick up one
# untested.
dependencies = ["mcp>=1.12,<3", "anthropic>=0.72,<2"]

[project.urls]
Repository = "https://github.com/H4l0B3nd3r/Wisdomtooth-MCP"
Issues = "https://github.com/H4l0B3nd3r/Wisdomtooth-MCP/issues"
Changelog = "https://github.com/H4l0B3nd3r/Wisdomtooth-MCP/blob/main/CHANGELOG.md"

[project.scripts]
wisdomtooth-mcp = "wisdomtooth.server:main"

[build-system]
# 1.27 is the first hatchling that reads PEP 639 `license` / `license-files`.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wisdomtooth"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "anyio>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
